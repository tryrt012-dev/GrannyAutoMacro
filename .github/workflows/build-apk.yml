name: Build Granny AutoBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Rakit File APK
        run: gradle assembleDebug

      - name: Siapkan File APK untuk Diunduh
        uses: actions/upload-artifact@v4
        with:
          name: Granny-AutoBot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
